name: rRNAops-pipeline
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python version
  - python=3.9
  
  # NOTE: Dorado must be installed separately - see installation instructions
  # Download from: https://github.com/nanoporetech/dorado
  
  # Preprocessing tools
  - porechop>=0.2.4
  - chopper>=0.5.0
  
  # Quality control and visualization
  - nanoplot>=1.40.0
  - nanostat>=1.6.0
  - fastqc>=0.12.0
  - multiqc>=1.14
  
  # Sequence processing and clustering
  - vsearch>=2.22.1
  - seqkit>=2.3.0
  - seqtk>=1.3
  - cutadapt>=4.4
  - swarm=3.0.0=hc9558a2_0
  
  # Polishing (optional)
  - medaka>=1.7.0
  - minimap2>=2.24
  - samtools>=1.17
  
  # BLAST and taxonomy
  - blast>=2.14.0
  
  # BIOM format tools
  - biom-format>=2.1.12
  
  # General utilities
  - parallel>=20230522
  - pigz>=2.6
  - bioawk
  - gawk
  
  # Python packages
  - biopython>=1.81
  - pandas>=2.0.0
  - numpy>=1.24.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pyyaml>=6.0
  - scipy>=1.10.0
  
  # For report generation
  - jinja2>=3.1.0
